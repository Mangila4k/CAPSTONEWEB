<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - PLSNHS, Placido L. Señor National High School</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Forgot Password CSS -->
    <link rel="stylesheet" href="css/forgot_password.css">
    <link rel="stylesheet" href="../css/chatbot.css">
</head>

<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fas fa-key"></i>
            </div>
            <h1 id="pageHeading">Forgot Password?</h1>
            <div class="subtitle" id="pageSubtitle">
                Enter your email address to receive your 6-digit confirmation security code.
            </div>
        </div>

        <!-- Alert Container -->
        <div id="alertContainer"></div>

        <!-- STEP 1: EMAIL LOOKUP & CODE DISPATCH -->
        <form id="forgotForm">
            <div class="input-group">
                <i class="fas fa-envelope"></i>
                <input type="email" name="email" id="emailInput" placeholder="Enter your registered email address"
                    required autofocus autocomplete="email">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <i class="fas fa-paper-plane"></i>
                <span>Send Reset Code</span>
            </button>
        </form>

        <!-- STEP 2: CODE VERIFICATION & NEW PASSWORD (Hidden initially) -->
        <div id="verifyStep" style="display: none; margin-top: 10px;">
            <!-- Gmail Dispatch Card -->
            <div
                style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; margin-bottom: 18px; text-align: center;">
                <p style="font-size: 13px; color: #475569; margin-bottom: 10px;">
                    We generated a confirmation code for <strong id="targetEmailLabel"
                        style="color: #0b2b4a;"></strong>.
                </p>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                    <button type="button" id="sendGmailResetBtn"
                        style="padding: 10px 16px; border-radius: 8px; background: #EA4335; color: #fff; border: none; cursor: pointer; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 6px rgba(234,67,53,0.25);">
                        <i class="fab fa-google"></i> Open in Gmail to View Code
                    </button>
                    <button type="button" id="copyResetCodeBtn"
                        style="padding: 8px 12px; border-radius: 8px; background: #f1f5f9; color: #1e293b; border: 1px solid #cbd5e1; cursor: pointer; font-weight: 600; font-size: 12px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;">
                        <i class="fas fa-copy"></i> Copy Code to Clipboard
                    </button>
                </div>
            </div>

            <form id="resetPasswordForm">
                <div class="input-group">
                    <i class="fas fa-shield-alt"></i>
                    <input type="text" id="codeInput" placeholder="Enter 6-digit confirmation code" maxlength="6"
                        required style="letter-spacing: 4px; font-weight: 700; font-family: monospace;">
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="newPasswordInput" placeholder="Enter new password" required
                        minlength="6">
                </div>

                <div class="input-group">
                    <i class="fas fa-check-double"></i>
                    <input type="password" id="confirmPasswordInput" placeholder="Confirm new password" required
                        minlength="6">
                </div>

                <button type="submit" class="submit-btn" id="saveNewPasswordBtn" style="background: #10b981;">
                    <i class="fas fa-check-circle"></i>
                    <span>Update Password</span>
                </button>
            </form>
        </div>

        <div class="back-link">
            <a href="login.html">
                <i class="fas fa-arrow-left"></i>
                Back to Login
            </a>
        </div>

        <div class="features">
            <div class="feature">
                <i class="fas fa-clock"></i>
                <span>Valid for 15 mins</span>
            </div>
            <div class="feature">
                <i class="fas fa-shield-alt"></i>
                <span>Secure & Encrypted</span>
            </div>
            <div class="feature">
                <i class="fas fa-envelope"></i>
                <span>Check your Gmail</span>
            </div>
        </div>
    </div>
    <script type="module" src="js/forgot_password.js"></script>
    <script src="../js/chatbot.js"></script>
</body>

</html>
